name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore
        env:
          DOLPHY_KEYSTORE_BASE64: ${{ secrets.DOLPHY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DOLPHY_KEYSTORE_BASE64"
          printf '%s' "$DOLPHY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dolphy-release.jks"
          chmod 600 "$RUNNER_TEMP/dolphy-release.jks"

      - name: Build release APK
        env:
          DOLPHY_KEYSTORE_FILE: ${{ runner.temp }}/dolphy-release.jks
          DOLPHY_KEYSTORE_PASSWORD: ${{ secrets.DOLPHY_KEYSTORE_PASSWORD }}
          DOLPHY_KEY_ALIAS: ${{ secrets.DOLPHY_KEY_ALIAS }}
          DOLPHY_KEY_PASSWORD: ${{ secrets.DOLPHY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
