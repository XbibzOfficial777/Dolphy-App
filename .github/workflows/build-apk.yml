name: Test, Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-release:
    name: Test, build and verify signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolphy-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Decode reusable release keystore
        env:
          DOLPHY_KEYSTORE_BASE64: ${{ secrets.DOLPHY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DOLPHY_KEYSTORE_BASE64"
          printf '%s' "$DOLPHY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dolphy-release.jks"
          chmod 600 "$RUNNER_TEMP/dolphy-release.jks"

      - name: Build signed release APK
        env:
          DOLPHY_KEYSTORE_FILE: ${{ runner.temp }}/dolphy-release.jks
          DOLPHY_KEYSTORE_PASSWORD: ${{ secrets.DOLPHY_KEYSTORE_PASSWORD }}
          DOLPHY_KEY_ALIAS: ${{ secrets.DOLPHY_KEY_ALIAS }}
          DOLPHY_KEY_PASSWORD: ${{ secrets.DOLPHY_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify packaged IR database
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          asset_root = Path("app/src/main/assets")
          expected = {
              p.relative_to(asset_root).as_posix()
              for base in ("Flipper-IRDB-main", "tv_best_remotes")
              for p in (asset_root / base).rglob("*.ir")
          }
          with ZipFile("app/build/outputs/apk/release/app-release.apk") as apk:
              actual = {
                  name.removeprefix("assets/")
                  for name in apk.namelist()
                  if name.startswith("assets/")
                  and name.removeprefix("assets/").split("/", 1)[0] in {"Flipper-IRDB-main", "tv_best_remotes"}
                  and name.endswith(".ir")
              }
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected:
              print("Missing IR assets:", missing[:30])
              print("Unexpected IR assets:", unexpected[:30])
              raise SystemExit(f"IR package mismatch: {len(missing)} missing, {len(unexpected)} unexpected")
          print(f"Verified {len(actual)} IR files inside the release APK")
          PY

      - name: Verify and package release APK
        id: package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -P 4 4 "$APK"
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          RELEASE_APK="$RUNNER_TEMP/Dolphy-${VERSION_NAME}-indonesia.apk"
          cp "$APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphy-${{ steps.package.outputs.version_name }}-signed-apk
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Dolphy ${VERSION_NAME}

          - Media casting nyata melalui Google Cast SDK resmi dan DLNA/UPnP dengan penemuan SSDP serta kontrol AVTransport.
          - Video, audio, dan gambar dapat dipilih; status koneksi dan playback berasal dari CastSession atau respons renderer.
          - Database IR disinkronkan dari Lucaslhm/Flipper-IRDB dan indexer rekursif kini menjangkau remote dalam direktori bertingkat.
          - Pencarian global merek/model mencakup database TV dan Flipper, dengan loading, penanganan error, dan route remote yang sesuai.
          - Antarmuka Dolphy Expressive tetap menggunakan identitas oranye Material 3 dan dukungan Indonesia, English, serta Русский.

          ## Verifikasi CI

          - Unit test JVM dijalankan pada GitHub Actions.
          - Release APK dibuat di GitHub Actions dan ditandatangani dengan kunci rilis tetap dari Secrets.
          - Seluruh path database IR di dalam APK dibandingkan dengan aset sumber.
          - Signature APK dan ZIP alignment diverifikasi pada runner.

          Perilaku fisik Chromecast, DLNA, BLE, NFC, IR, kamera, dan hardware lain tetap memerlukan validasi pada perangkat nyata; runner GitHub tidak menguji perangkat tersebut.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Dolphy $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
              --verify-tag \
              --title "Dolphy $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
